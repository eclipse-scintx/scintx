# SCINTX Gateway default configuration (#65, #73)
schemaVersion: "1"

gateway:
  instanceId: gateway-001
  version: 0.1.0
  addr: ":8080"
  defaultPolicy: baseline-security
  policiesDir: ./policies
  maxArtifactBytes: 104857600

providers:
  osv:
    enabled: true
    required: false
    baseUrl: https://api.osv.dev
    timeout: 15s
    maxConcurrency: 20

  ossindex:
    enabled: true
    required: false
    baseUrl: https://ossindex.sonatype.org
    timeout: 30s
    maxConcurrency: 10
    requireAuth: true
