name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Scan secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: "3.97.4"
          path: ./
          # No base/head inputs: the action resolves per-event base..head SHAs
          # itself (PR diff scan, full history scan on schedule). A named
          # branch base does not resolve: checkout leaves only
          # refs/remotes/origin/* and trufflehog's temp clone rewrites them,
          # so `--since-commit main` fails with "no base refs succeeded"
          # while still exiting 0 (a silent no-op scan).
          extra_args: --results=verified,unknown --exclude-globs vendor/*