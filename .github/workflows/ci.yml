name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: this job only checks out code and runs tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          # "trust" means no password. That is fine here: the database is
          # empty, lives only for this job, and is only reachable from it.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: scintx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The PostgreSQL tests in internal/gateway are skipped unless this is set.
      SCINTX_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/scintx_test?sslmode=disable
    steps:
      # Pin to commit SHA (tags are mutable). Dependabot updates these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Schema Python deps
        run: pip install --require-hashes -r scripts/requirements-schemas.txt
      - name: Install golangci-lint
        run: |
          # SHA-256 verified tarball — version-pinned, tag URLs are mutable.
          curl --fail --silent --show-error --location \
            "https://github.com/golangci/golangci-lint/releases/download/v2.2.1/golangci-lint-2.2.1-linux-amd64.tar.gz" \
            -o /tmp/golangci.tgz
          echo "4098436776a4f4bbef25dcad93f56533003d085f9133e4c69ba3145973d211dc  /tmp/golangci.tgz" | sha256sum --check -
          mkdir -p /tmp/gcl-bin
          tar -xzf /tmp/golangci.tgz -C /tmp/gcl-bin --strip-components=1
          sudo mv /tmp/gcl-bin/golangci-lint /usr/local/bin/
      - name: Check
        run: |
          chmod +x scripts/*.sh
          CHECK_GENERATED=1 ./scripts/check.sh
      - name: Test coverage
        run: ./scripts/test-coverage.sh
