name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: this job only checks out code and runs tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin to commit SHA (tags are mutable). Dependabot updates these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Schema Python deps
        run: pip install --require-hashes -r scripts/requirements-schemas.txt
      - name: Install golangci-lint
        run: |
          # SHA-256 verified tarball — version-pinned, tag URLs are mutable.
          curl --fail --silent --show-error --location \
            "https://github.com/golangci/golangci-lint/releases/download/v2.2.1/golangci-lint-2.2.1-linux-amd64.tar.gz" \
            -o /tmp/golangci.tgz
          echo "4098436776a4f4bbef25dcad93f56533003d085f9133e4c69ba3145973d211dc  /tmp/golangci.tgz" | sha256sum --check -
          mkdir -p /tmp/gcl-bin
          tar -xzf /tmp/golangci.tgz -C /tmp/gcl-bin --strip-components=1
          sudo mv /tmp/gcl-bin/golangci-lint /usr/local/bin/
      - name: Check
        run: |
          chmod +x scripts/*.sh
          CHECK_GENERATED=1 ./scripts/check.sh
      - name: Test coverage
        run: ./scripts/test-coverage.sh