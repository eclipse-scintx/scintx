openapi: 3.1.0
info:
  title: Eclipse SCINTX Gateway API
  version: 0.1.0
  description: Versioned HTTP API for artifact submissions, status polling, Aggregate Reports, and Policy Reports.
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Gateway process is alive
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Gateway is ready to accept submissions
        "503":
          description: Gateway is not ready or is shutting down
  /v1/submissions:
    post:
      summary: Create an artifact submission
      responses:
        "202":
          description: Submission accepted
        "400":
          description: Malformed request
        "422":
          description: Artifact or policy validation failed
  /v1/submissions/{id}:
    get:
      summary: Get submission status and summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission status
        "404":
          description: Submission not found
  /v1/submissions/{id}/aggregate-report:
    get:
      summary: Get the immutable Aggregate Report for a submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregate Report
  /v1/submissions/{id}/policy-report:
    get:
      summary: Get the Policy Report for a submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy Report
