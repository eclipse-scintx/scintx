# Lean 4 project that formally verifies the SCINTX lease architecture.
# It has no dependencies (no Mathlib), so it builds in seconds.
# Check every proof with: ./scripts/formal.sh   (or "lake build" in this folder)
name = "LeaseProof"
defaultTargets = ["LeaseProof"]

[[lean_lib]]
name = "LeaseProof"
